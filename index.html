
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MBP Attendance" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="description" content="Employee attendance and team management CRM" />
    <title>MBP Attendance</title>
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('mbp_crm_preferences') || '{}');
          var theme = saved.theme === 'day' ? 'day' : 'night';
          var accent = saved.accent === 'blue' ? 'blue' : 'orange';
          var root = document.documentElement;
          root.dataset.crmTheme = theme;
          root.dataset.crmAccent = accent;
          if (saved.compact) root.classList.add('crm-compact');
          if (saved.reducedMotion) root.classList.add('crm-reduced-motion');
          if (saved.nightLight) root.classList.add('crm-night-light');
          root.style.backgroundColor = theme === 'day' ? '#edf1f7' : '#0c0d10';
          root.style.colorScheme = theme === 'day' ? 'light' : 'dark';
        } catch (_) {}
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
