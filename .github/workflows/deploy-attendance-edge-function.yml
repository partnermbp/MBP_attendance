name: Deploy attendance Edge Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/manager-team-attendance/**"
      - "supabase/functions/telegram-auth/**"
      - ".github/workflows/deploy-attendance-edge-function.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.39.2
      - name: Deploy Telegram authentication function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          supabase functions deploy telegram-auth --project-ref "ncpcpckajzzqxxxonfnv" --yes
      - name: Deploy manager attendance function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          supabase functions deploy manager-team-attendance --project-ref "ncpcpckajzzqxxxonfnv" --yes
