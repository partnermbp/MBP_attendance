name: Deploy secure MFA login Edge Function

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-auth-mfa-login.yml"
      - "supabase/functions/auth-mfa-login/**"
      - "supabase/functions/telegram-auth/**"
      - "supabase/functions/telegram-inbox-refresh/**"
      - "supabase/functions/telegram-inbox-status/**"
      - "supabase/functions/telegram-media-proxy/**"

concurrency:
  group: supabase-edge-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.39.2
      - name: Deploy secure MFA login function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          supabase functions deploy auth-mfa-login --project-ref "ncpcpckajzzqxxxonfnv" --yes
          supabase functions deploy telegram-auth --project-ref "ncpcpckajzzqxxxonfnv" --no-verify-jwt --yes
          supabase functions deploy telegram-inbox-refresh --project-ref "ncpcpckajzzqxxxonfnv" --yes
          supabase functions deploy telegram-inbox-status --project-ref "ncpcpckajzzqxxxonfnv" --yes
          supabase functions deploy telegram-media-proxy --project-ref "ncpcpckajzzqxxxonfnv" --yes
