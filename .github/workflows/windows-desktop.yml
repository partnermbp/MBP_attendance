name: Build MBP Attendance Windows Desktop EXE

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-desktop
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm install

      - name: Create Windows icon from supplied CRM logo
        shell: pwsh
        run: |
          python -m pip install Pillow
          New-Item -ItemType Directory -Force build | Out-Null
          @'
          from PIL import Image
          from pathlib import Path
          source = Path("public/icons/attendance-logo.png")
          if not source.exists():
              raise SystemExit("The supplied logo file public/icons/attendance-logo.png is missing.")
          image = Image.open(source).convert("RGBA")
          image.save("build/icon.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding utf8 make_icon.py
          python make_icon.py

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBP-Attendance-Windows-Installer
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Latest MBP Attendance Windows Installer
          prerelease: true
          make_latest: false
          files: dist-electron/*.exe
          overwrite_files: true
          fail_on_unmatched_files: true
