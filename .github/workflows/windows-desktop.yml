name: Build attendence_crm Windows Desktop EXE

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'package.json'
      - 'public/icons/**'\n      - 'scripts/branding/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-desktop
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm install

      - name: Generate Windows icon from shared vector logo
        shell: pwsh
        run: |
          python -m pip install Pillow CairoSVG
          python scripts/branding/generate_icons.py
          @'
          from PIL import Image
          Image.open("public/icons/attendance-logo.png").convert("RGBA").save("build/icon.ico", format="ICO", sizes=[(256,256)])
          '@ | Set-Content -Encoding utf8 make_icon.py
          New-Item -ItemType Directory -Force build | Out-Null
          python make_icon.py

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendence_crm-Windows-Installer
          path: dist-electron/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Latest attendence_crm Windows Installer
          prerelease: true
          make_latest: false
          files: dist-electron/*.exe
          overwrite_files: true
          fail_on_unmatched_files: true
