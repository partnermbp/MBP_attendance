name: Update Supabase Magic Link Email Template

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-auth-email-template.yml'

permissions:
  contents: read

jobs:
  update-template:
    runs-on: ubuntu-latest
    steps:
      - name: Update Magic Link email to use numeric OTP
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN repository secret is missing or empty."
            exit 1
          fi

          cat > email-template.html <<'HTML'
<div style="margin:0;padding:35px 15px;background-color:#f3f4f6;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#111827;border-radius:16px;overflow:hidden;">
    <div style="padding:25px 28px 20px;border-bottom:1px solid #374151;">
      <div style="font-size:17px;font-weight:800;letter-spacing:1.5px;color:#ffffff;"><span style="color:#f97316;">●</span> ATTENDANCE CRM</div>
    </div>
    <div style="padding:32px 28px 20px;">
      <div style="font-size:25px;line-height:1.3;font-weight:700;color:#ffffff;">Your Attendance CRM<br>verification code</div>
      <p style="margin:16px 0 25px;font-size:14px;line-height:1.7;color:#cbd5e1;">A secure login attempt was made for your account. Enter the one-time verification code below to continue.</p>
      <div style="padding:24px 15px;background:#1f2937;border:1px solid #374151;border-radius:12px;text-align:center;">
        <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:#fb923c;">YOUR ONE-TIME PASSWORD</div>
        <div style="margin:15px 0;font-size:36px;line-height:1.3;font-weight:800;letter-spacing:9px;color:#ffffff;">{{ .Token }}</div>
        <div style="font-size:12px;color:#9ca3af;">Enter this code in the CRM login screen</div>
      </div>
      <p style="margin:22px 0 0;font-size:13px;line-height:1.6;color:#cbd5e1;"><span style="color:#fb923c;font-weight:700;">Security notice:</span> This code expires shortly and can only be used once.</p>
    </div>
    <div style="padding:20px 28px 25px;border-top:1px solid #374151;">
      <p style="margin:0 0 14px;font-size:12px;line-height:1.6;color:#9ca3af;">If you did not attempt to sign in, please contact your administrator. Never share this verification code with anyone.</p>
      <div style="font-size:10px;letter-spacing:1.5px;font-weight:700;color:#6b7280;text-align:center;">SECURE ACCESS · ATTENDANCE CRM</div>
    </div>
  </div>
</div>

          HTML
          SUBJECT="Your Attendance CRM verification code"
          CONTENT="$(cat email-template.html)"
          PAYLOAD="$(jq -n --arg subject "$SUBJECT" --arg content "$CONTENT" '{mailer_subjects_magic_link:$subject,mailer_templates_magic_link_content:$content}')"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "https://api.supabase.com/v1/projects/ncpcpckajzzqxxxonfnv/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --output /tmp/supabase-update-response.json

          curl --fail-with-body --silent --show-error \
            --url "https://api.supabase.com/v1/projects/ncpcpckajzzqxxxonfnv/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Accept: application/json" \
            --output /tmp/supabase-auth-config.json

          if jq -e '.mailer_templates_magic_link_content | strings | contains("{{ .Token }}")' /tmp/supabase-auth-config.json >/dev/null; then
            echo "SUCCESS: Supabase Magic Link template now contains the numeric OTP token placeholder."
          else
            echo "The update request completed, but the verification check did not find {{ .Token }} in the saved template."
            exit 1
          fi
