name: Build attendence_crm macOS DMG

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'desktop/**'
      - 'package.json'
      - 'public/icons/**'
      - 'scripts/branding/**'
      - '.github/workflows/macos-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-desktop
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build universal macOS DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create macOS icon from supplied CRM logo
        shell: bash
        run: |
          set -euo pipefail
          node scripts/branding/render-logo.mjs
          source="public/icons/attendance-logo.png"
          iconset="build/icon.iconset"
          if [[ ! -f "$source" ]]; then
            echo "::error::The supplied logo file $source is missing."
            exit 1
          fi

          mkdir -p "$iconset"
          sips -z 16 16 "$source" --out "$iconset/icon_16x16.png" >/dev/null
          sips -z 32 32 "$source" --out "$iconset/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$source" --out "$iconset/icon_32x32.png" >/dev/null
          sips -z 64 64 "$source" --out "$iconset/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$source" --out "$iconset/icon_128x128.png" >/dev/null
          sips -z 256 256 "$source" --out "$iconset/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$source" --out "$iconset/icon_256x256.png" >/dev/null
          sips -z 512 512 "$source" --out "$iconset/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$source" --out "$iconset/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$source" --out "$iconset/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$iconset" -o build/icon.icns
          test -s build/icon.icns

      - name: Validate Electron startup scripts
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs

      - name: Build universal macOS DMG
        run: npx electron-builder --mac dmg --universal --publish never

      - name: Verify DMG and packaged macOS app
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find dist-electron -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          hdiutil verify "$dmg"
          mountpoint="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mountpoint" -quiet || true
            rmdir "$mountpoint" || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint" -quiet
          app_path="$mountpoint/attendence_crm.app"
          test -d "$app_path"
          plutil -lint "$app_path/Contents/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          test -x "$app_path/Contents/MacOS/$executable"
      - name: Upload macOS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendence_crm-macOS-DMG
          path: dist-electron/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest macOS installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-latest
          name: Latest attendence_crm macOS Installer
          prerelease: true
          make_latest: false
          files: dist-electron/*.dmg
          overwrite_files: true
          fail_on_unmatched_files: true
