name: Build Attendance CRM Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/android/**'
      - 'scripts/branding/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build the bundled CRM interface
        run: npm run build:android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Generate the native Android project
        run: npx cap add android

      - name: Install icon generation dependencies
        run: python -m pip install Pillow

      - name: Apply Android permissions
        run: python3 scripts/android/prepare_android.py

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Assemble installable APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK to the CRM app filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/Attendance CRM.apk"

      - name: Keep APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Attendance-CRM-Android-APK
          path: android/app/build/outputs/apk/debug/attendence_crm.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Attendance CRM Android APK
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/attendence_crm.apk
          overwrite_files: true
          fail_on_unmatched_files: true
